name: Manual Cloudflare Pages deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regimealpha-manual-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build:static

      - name: Deploy production Pages site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy out --project-name regimealpha --branch main --commit-hash "${GITHUB_SHA}"
